# Storage is NVMesh. Nothing to apply here in the default "adopt" mode:
# your existing VMs already boot from NVMesh volumes with the games installed,
# and the API only labels, starts and stops them.
#
# Optional — VM_CREATE_MODE=clone (let the API create extra pool VMs automatically):
# each new VM's boot disk is a CDI clone of SOURCE_DISK_PVC, one of your existing NVMesh
# volumes with Windows + games installed. Clone a *stopped* VM's disk so it's consistent.
#
#   kubectl -n nimbus get pvc                       # find the disk to copy, e.g. win11-games-01
#   SOURCE_DISK_PVC=win11-games-01
#   K8S_STORAGE_CLASS=<your nvmesh class>           # kubectl get storageclass
#   BOOT_DISK_SIZE=500Gi                            # ≥ the source volume size
#
# If your VMs are in another namespace, set K8S_NAMESPACE to it and apply
# deploy/k8s/00-namespace-rbac.yaml with that namespace instead of "nimbus".
