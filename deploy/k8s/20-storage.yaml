# NVMesh storage — current cluster layout (namespace "gaming"):
#
#   gaming/np-game-library   7451Gi · Block · RWO · StorageClass nvmesh-golden-retain · VPG DEFAULT_RAID_10_VPG
#                            attached to VM golden-windows-build as a virtio disk, serial NIMBUSGAME
#   nvmesh-raid10            StorageClass for boot-disk clones
#
# Default mode (VM_CREATE_MODE=adopt): nothing to apply — existing VMs keep their NVMesh disks.
#
# Clone mode, once the golden boot image PVC is built (GOLDEN_IMAGE_PVC):
#   GAME_LIBRARY_MODE=clone   each new pool VM gets its own CDI clone of np-game-library (RWO is fine).
#                             Stop golden-windows-build first so the clone is consistent.
#   GAME_LIBRARY_MODE=shared  make ONE read-many copy and attach it read-only to every VM
#                             (NVMesh supports ReadWriteMany for Block volumes):
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: np-game-library-shared
  namespace: gaming
spec:
  source:
    pvc: { namespace: gaming, name: np-game-library }
  storage:
    storageClassName: nvmesh-golden-retain
    accessModes: ["ReadWriteMany"]
    volumeMode: Block
    resources:
      requests:
        storage: 7451Gi
# then: GAME_LIBRARY_MODE=shared, GAME_LIBRARY_PVC=np-game-library-shared
